name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (.NET 10) + tenant isolation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore FxOs.slnx
      - run: dotnet build FxOs.slnx --no-restore -c Release
      # Testcontainers starts timescale/timescaledb with the runner's Docker.
      - run: dotnet test FxOs.slnx --no-build -c Release --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: "**/TestResults/*.trx"

  web:
    name: Web (Next.js) + Violeta UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # Typechecks packages/ui and apps/web (also proves the ES/EN catalogs have the same keys).
      - run: pnpm -r typecheck
      - run: pnpm --filter @fxos/web build
        env:
          FX_API_BASE_URL: http://localhost:5080
          FX_DEV_TENANT_SWITCHER: "true"

  workers:
    name: Python workers (+ rate loader on TimescaleDB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Loader tests create a throwaway database, apply db/tenant migrations, and drop it.
      FX_TEST_PG_DSN: host=localhost port=5432 user=postgres password=postgres dbname=postgres
    defaults:
      run:
        working-directory: workers/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q
