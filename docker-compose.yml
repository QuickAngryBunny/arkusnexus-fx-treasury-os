# Local development stack.
# One PostgreSQL server hosts the control-plane database (fx_control) and one database per tenant.
# The TimescaleDB image is used from day one so Phase 1 hypertables need no infrastructure change.
services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Local Azure Blob emulator: the immutable raw store for fetched rate responses (Phase 1).
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck --loose
    ports:
      - "10000:10000"
    volumes:
      - azurite:/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
  azurite:
